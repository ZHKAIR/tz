apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "terralist.fullname" . }}
  labels:
    {{- include "terralist.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "terralist.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "terralist.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "terralist.selectorLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
      - name: terralist
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 5758
          protocol: TCP
        env:
        # Минимальная конфигурация для запуска
        - name: TERRALIST_LOG_LEVEL
          value: "debug"
        - name: TERRALIST_DATABASE_BACKEND
          value: "sqlite"
        - name: TERRALIST_SQLITE_PATH
          value: "./terralist.db"  # Используем относительный путь
        - name: TERRALIST_SERVER_HOST
          value: "0.0.0.0"
        - name: TERRALIST_SERVER_PORT
          value: "5758"
        volumeMounts:
        - name: data
          mountPath: /app
        workingDir: /app
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.persistence.size }}