apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "terralist.fullname" . }}
  labels:
    {{- include "terralist.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "terralist.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "terralist.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "terralist.selectorLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      initContainers:
      - name: init-db
        image: busybox:1.35
        command: ['sh', '-c']
        args:
          - |
            mkdir -p /data
            if [ ! -f /data/terralist.db ]; then
              touch /data/terralist.db
            fi
            chown -R 1000:1000 /data
            chmod 755 /data
            chmod 644 /data/terralist.db
            echo "Init completed. Directory structure:"
            ls -la /data/
        volumeMounts:
        - name: data
          mountPath: /data
        securityContext:
          runAsUser: 0
      containers:
      - name: terralist
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        # КРИТИЧНО: НЕ указываем command! Используем entrypoint из образа
        # Указываем только args для передачи "server"
        args: ["server"]
        ports:
        - name: http
          containerPort: 5758
          protocol: TCP
        env:
        # Базовая конфигурация
        - name: TERRALIST_LOG_LEVEL
          value: "debug"
        - name: TERRALIST_DATABASE_BACKEND
          value: "sqlite"
        - name: TERRALIST_SQLITE_PATH
          value: "/data/terralist.db"
        - name: TERRALIST_SERVER_HOST
          value: "0.0.0.0"
        - name: TERRALIST_SERVER_PORT
          value: "5758"
        - name: TERRALIST_URL
          value: "https://terralist.caas.k-mkaas-dev-1.cloud.preprod.world"
        
        # OAuth конфигурация
        - name: TERRALIST_OAUTH_PROVIDER
          value: "oidc"
        - name: TERRALIST_OI_SCOPE
          value: "openid email profile"
        - name: TERRALIST_OI_CLIENT_ID
          value: {{ .Values.config.auth.oauth.clientId | quote }}
        - name: TERRALIST_OI_CLIENT_SECRET
          value: {{ .Values.config.auth.oauth.clientSecret | quote }}
        - name: TERRALIST_OI_AUTHORIZE_URL
          value: "{{ .Values.config.auth.oauth.issuerUrl }}/protocol/openid-connect/auth"
        - name: TERRALIST_OI_TOKEN_URL
          value: "{{ .Values.config.auth.oauth.issuerUrl }}/protocol/openid-connect/token"
        - name: TERRALIST_OI_USERINFO_URL
          value: "{{ .Values.config.auth.oauth.issuerUrl }}/protocol/openid-connect/userinfo"
        
        # Секреты
        - name: TERRALIST_COOKIE_SECRET
          value: {{ .Values.config.auth.cookieSecret | quote }}
        - name: TERRALIST_TOKEN_SIGNING_SECRET
          value: {{ .Values.config.auth.tokenSigningSecret | quote }}
        
        # Анонимный доступ
        - name: TERRALIST_ALLOW_ANONYMOUS_DOWNLOADS
          value: "true"
        
        # S3 конфигурация
        - name: TERRALIST_S3_ENDPOINT
          value: "s-ed1.cloud.gcore.lu"
        - name: TERRALIST_S3_BUCKET_NAME
          value: "terralist-artifacts"
        - name: TERRALIST_S3_BUCKET_REGION
          value: "eu-central-1"
        - name: TERRALIST_S3_ACCESS_KEY_ID
          value: "BVQO6XXVBZAB6EYQX02G"
        - name: TERRALIST_S3_SECRET_ACCESS_KEY
          value: "jlObBtZA7aJ7Gzx2b2vhzfK1MgrcS495Q5ChR3La"
        - name: TERRALIST_S3_USE_PATH_STYLE
          value: "true"
        - name: TERRALIST_S3_PRESIGN_EXPIRE
          value: "15"
        
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
        
        volumeMounts:
        - name: data
          mountPath: /data
        
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          tcpSocket:
            port: {{ .Values.livenessProbe.tcpSocket.port }}
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          successThreshold: {{ .Values.livenessProbe.successThreshold }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
        {{- end }}
        
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.readinessProbe.tcpSocket.port }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          successThreshold: {{ .Values.readinessProbe.successThreshold }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
        {{- end }}
        
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
          
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.persistence.size }}