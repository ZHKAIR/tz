apiVersion: v1
kind: Pod
metadata:
  name: terralist-debug-paths
spec:
  containers:
  - name: test
    image: ghcr.io/terralist/terralist:v0.8.0
    command: ["/bin/sh", "-c"]
    args:
      - |
        echo "=== Testing different paths ==="
        
        # Test 1: /tmp path
        export TERRALIST_DATABASE_BACKEND=sqlite
        export TERRALIST_SQLITE_PATH=/tmp/test.db
        export TERRALIST_SERVER_HOST=0.0.0.0
        export TERRALIST_SERVER_PORT=5758
        echo "Test 1: /tmp/test.db"
        /usr/local/bin/terralist server &
        PID1=$!
        sleep 5
        kill $PID1 2>/dev/null || true
        
        # Test 2: /data path
        mkdir -p /data
        export TERRALIST_SQLITE_PATH=/data/test.db
        echo -e "\nTest 2: /data/test.db"
        /usr/local/bin/terralist server &
        PID2=$!
        sleep 5
        kill $PID2 2>/dev/null || true
        
        # Test 3: relative path
        cd /tmp
        export TERRALIST_SQLITE_PATH=./test.db
        echo -e "\nTest 3: ./test.db (in /tmp)"
        /usr/local/bin/terralist server &
        PID3=$!
        sleep 5
        kill $PID3 2>/dev/null || true
        
        # Test 4: absolute path with subdirs
        mkdir -p /home/terralist/data
        export TERRALIST_SQLITE_PATH=/home/terralist/data/test.db
        echo -e "\nTest 4: /home/terralist/data/test.db"
        /usr/local/bin/terralist server &
        PID4=$!
        sleep 5
        kill $PID4 2>/dev/null || true
        
        echo -e "\n=== Tests completed ==="
        sleep 3600
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    emptyDir: {}