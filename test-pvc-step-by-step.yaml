# Шаг 1: Минимальный StatefulSet с PVC
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: terralist-pvc-test
spec:
  serviceName: terralist-pvc-test
  replicas: 1
  selector:
    matchLabels:
      app: terralist-pvc-test
  template:
    metadata:
      labels:
        app: terralist-pvc-test
    spec:
      initContainers:
      - name: init-db
        image: busybox:1.35
        command: ['sh', '-c']
        args:
          - |
            mkdir -p /data
            touch /data/terralist.db
            chown -R 1000:1000 /data
            chmod 755 /data
            chmod 644 /data/terralist.db
            ls -la /data/
        volumeMounts:
        - name: data
          mountPath: /data
        securityContext:
          runAsUser: 0
      containers:
      - name: terralist
        image: ghcr.io/terralist/terralist:v0.8.0
        env:
        - name: TERRALIST_DATABASE_BACKEND
          value: "sqlite"
        - name: TERRALIST_SQLITE_PATH
          value: "/data/terralist.db"
        - name: TERRALIST_SERVER_HOST
          value: "0.0.0.0"
        - name: TERRALIST_SERVER_PORT
          value: "5758"
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi