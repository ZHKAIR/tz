apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "terralist.fullname" . }}
  labels:
    {{- include "terralist.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "terralist.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "terralist.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "terralist.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      enableServiceLinks: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.persistence.enabled }}
      initContainers:
      - name: init-permissions
        image: busybox:1.35
        command: ['sh', '-c']
        args:
          - |
            echo "=== Setting up directory permissions ==="
            mkdir -p /mnt/data
            chmod 777 /mnt/data
            
            if [ -f /mnt/data/terralist.db ]; then
              echo "Database file exists, setting permissions..."
              chmod 666 /mnt/data/terralist.db
            else
              echo "Database file does not exist, will be created by Terralist"
            fi
            
            echo "Directory contents:"
            ls -la /mnt/data/
        volumeMounts:
        - name: data
          mountPath: /mnt/data
        securityContext:
          runAsUser: 0
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        {{- if .Values.containerSecurityContext.enabled }}
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 12 }}
        {{- end }}
        image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.config.server.port }}
          protocol: TCP
        env:
        - name: TERRALIST_LOG_LEVEL
          value: {{ .Values.config.server.logLevel | quote }}
        - name: TERRALIST_DATABASE_BACKEND
          value: {{ .Values.config.database.backend | quote }}
        {{- if .Values.persistence.enabled }}
        - name: TERRALIST_SQLITE_PATH
          value: "/mnt/data/terralist.db"
        {{- else }}
        - name: TERRALIST_SQLITE_PATH
          value: "/tmp/terralist.db"
        {{- end }}
        - name: TERRALIST_SERVER_HOST
          value: {{ .Values.config.server.host | quote }}
        - name: TERRALIST_SERVER_PORT
          value: {{ .Values.config.server.port | quote }}
        - name: TERRALIST_URL
          value: {{ .Values.config.url | quote }}
        - name: TERRALIST_OAUTH_PROVIDER
          value: {{ .Values.config.auth.oauth.provider | quote }}
        {{- if eq .Values.config.auth.oauth.provider "oidc" }}
        - name: TERRALIST_OI_SCOPE
          value: {{ .Values.config.auth.oauth.scope | quote }}
        - name: TERRALIST_OI_CLIENT_ID
          value: {{ .Values.config.auth.oauth.clientId | quote }}
        - name: TERRALIST_OI_CLIENT_SECRET
          value: {{ .Values.config.auth.oauth.clientSecret | quote }}
        - name: TERRALIST_OI_AUTHORIZE_URL
          value: "{{ .Values.config.auth.oauth.issuerUrl }}/protocol/openid-connect/auth"
        - name: TERRALIST_OI_TOKEN_URL
          value: "{{ .Values.config.auth.oauth.issuerUrl }}/protocol/openid-connect/token"
        - name: TERRALIST_OI_USERINFO_URL
          value: "{{ .Values.config.auth.oauth.issuerUrl }}/protocol/openid-connect/userinfo"
        {{- end }}
        - name: TERRALIST_COOKIE_SECRET
          value: {{ .Values.config.auth.cookieSecret | quote }}
        - name: TERRALIST_TOKEN_SIGNING_SECRET
          value: {{ .Values.config.auth.tokenSigningSecret | quote }}
        - name: TERRALIST_ALLOW_ANONYMOUS_DOWNLOADS
          value: {{ .Values.config.allowAnonymousDownloads | quote }}
        {{- if .Values.config.s3.enabled }}
        - name: TERRALIST_S3_ENDPOINT
          value: {{ .Values.config.s3.endpoint | quote }}
        - name: TERRALIST_S3_BUCKET_NAME
          value: {{ .Values.config.s3.bucketName | quote }}
        - name: TERRALIST_S3_BUCKET_REGION
          value: {{ .Values.config.s3.bucketRegion | quote }}
        - name: TERRALIST_S3_ACCESS_KEY_ID
          value: {{ .Values.config.s3.accessKeyId | quote }}
        - name: TERRALIST_S3_SECRET_ACCESS_KEY
          value: {{ .Values.config.s3.secretAccessKey | quote }}
        - name: TERRALIST_S3_USE_PATH_STYLE
          value: {{ .Values.config.s3.usePathStyle | quote }}
        - name: TERRALIST_S3_PRESIGN_EXPIRE
          value: {{ .Values.config.s3.presignExpire | quote }}
        {{- end }}
        {{- if .Values.extraEnvVars }}
        {{- toYaml .Values.extraEnvVars | nindent 8 }}
        {{- end }}
        {{- if .Values.extraEnvVarsCM }}
        envFrom:
        - configMapRef:
            name: {{ .Values.extraEnvVarsCM }}
        {{- end }}
        {{- if .Values.extraEnvVarsSecret }}
        - secretRef:
            name: {{ .Values.extraEnvVarsSecret }}
        {{- end }}
        volumeMounts:
        {{- if .Values.persistence.enabled }}
        - name: data
          mountPath: /mnt/data
        {{- end }}
        {{- if .Values.extraVolumeMounts }}
        {{- toYaml .Values.extraVolumeMounts | nindent 8 }}
        {{- end }}
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          tcpSocket:
            port: {{ .Values.livenessProbe.tcpSocket.port }}
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          successThreshold: {{ .Values.livenessProbe.successThreshold }}
        {{- end }}
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.readinessProbe.tcpSocket.port }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          successThreshold: {{ .Values.readinessProbe.successThreshold }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.extraVolumes }}
      volumes:
      {{- toYaml .Values.extraVolumes | nindent 6 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
  - metadata:
      name: data
      {{- with .Values.persistence.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      accessModes:
      {{- range .Values.persistence.accessModes }}
        - {{ . | quote }}
      {{- end }}
      {{- if .Values.persistence.storageClass }}
      {{- if (eq "-" .Values.persistence.storageClass) }}
      storageClassName: ""
      {{- else }}
      storageClassName: {{ .Values.persistence.storageClass | quote }}
      {{- end }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size | quote }}
      {{- with .Values.persistence.selector }}
      selector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- end }}